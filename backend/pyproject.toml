[project]
name = "pact"
version = "0.1.0"
description = "Pact — autonomous B2B procurement negotiation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "google-genai>=0.3",
    "google-cloud-bigquery>=3.25",
    "pyyaml>=6.0",
    "ijson>=3.3",
    "python-dotenv>=1.0",
    "mcp>=2.0",
    "google-adk>=2.6",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "transformers>=4.40",
    "torch>=2.2",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "pyjwt>=2.8",
    "slowapi>=0.1.9",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "google-cloud-pubsub>=2.21",
    "google-cloud-firestore>=2.16",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "pillow>=10.0",
    "ruff>=0.16",
    "bandit>=1.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# E4/E7/E9 + F: real pyflakes/pycodestyle errors (unused/undefined names,
# syntax issues). I: import sorting. B: flake8-bugbear real bug patterns.
# Deliberately not selecting BLE001/S110 (blind except / try-except-pass):
# several modules in this codebase catch broadly on purpose and fall back
# to a documented degraded mode rather than block a negotiation on a
# narration/guardrail/tracing failure -- see docs/ENGINEERING_LOG.md.
select = ["E4", "E7", "E9", "F", "I", "B"]
# B008: FastAPI's own documented pattern for file/query/body params
# (`image: UploadFile = File(...)`) is a function call in a default arg;
# bugbear can't distinguish this from a real mutable-default bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before the rest of pact.main's imports so that
# GEMINI_API_KEY etc. are already set when those modules read the
# environment at import time.
"pact/main.py" = ["E402"]

[tool.bandit]
# Same rationale as the ruff BLE001/S110 exclusion above: this codebase's
# guardrail/narration/tracing fallbacks intentionally catch broadly and
# degrade gracefully rather than block a negotiation. B110 (try-except-pass)
# and B112 (try-except-continue) fire on exactly those disclosed patterns.
skips = ["B110", "B112"]
exclude_dirs = ["tests", ".venv"]

[tool.setuptools.packages.find]
include = ["pact*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
