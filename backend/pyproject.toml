[project]
name = "pact"
version = "0.1.0"
description = "Pact — autonomous B2B procurement negotiation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "google-genai>=0.3",
    "google-cloud-bigquery>=3.25",
    "pyyaml>=6.0",
    "ijson>=3.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["pact*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
