name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v
        # No GEMINI_API_KEY secret is configured here on purpose -- the two
        # tests in tests/integration/test_requirement_parser.py that need a
        # real key skip themselves (pytest.mark.skipif) rather than fail;
        # everything else, including the real AWS/Azure pricing API calls,
        # runs for real against the public internet.

  backend-distributed:
    name: Backend (distributed negotiation, Pub/Sub + Firestore emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        id: setup-java
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Start Pub/Sub + Firestore emulators
        run: |
          # ubuntu-latest's preinstalled gcloud has its component manager
          # disabled (apt-managed, not self-update); its own error message
          # points at apt package names, but the Google Cloud SDK apt repo
          # itself isn't actually registered on this image (gcloud is
          # preinstalled a different way) -- register it explicitly per
          # Google's documented setup before installing the emulators.
          sudo apt-get install -y apt-transport-https ca-certificates gnupg curl
          curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" \
            | sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list
          sudo apt-get update
          sudo apt-get install -y google-cloud-cli-pubsub-emulator google-cloud-cli-firestore-emulator
          # google-cloud-cli-firestore-emulator pulls in openjdk-8 as an apt
          # dependency, which can shadow `java` on PATH -- the Firestore
          # emulator needs a real 21+ JRE, so force PATH back to the one
          # actions/setup-java just configured before starting it.
          export JAVA_HOME="${{ steps.setup-java.outputs.path }}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          gcloud beta emulators pubsub start --host-port=localhost:8085 > /tmp/pubsub-emulator.log 2>&1 &
          gcloud emulators firestore start --host-port=localhost:8080 > /tmp/firestore-emulator.log 2>&1 &
          # Cold JVM startup on a fresh runner (right after a ~2-minute
          # apt install) is slower and less predictable than a fixed
          # sleep -- poll each port instead of guessing a duration.
          for i in $(seq 1 60); do
            pubsub_up=0; firestore_up=0
            (echo > /dev/tcp/localhost/8085) 2>/dev/null && pubsub_up=1
            (echo > /dev/tcp/localhost/8080) 2>/dev/null && firestore_up=1
            if [ "$pubsub_up" = "1" ] && [ "$firestore_up" = "1" ]; then
              echo "Both emulators are up after ${i}s"
              break
            fi
            sleep 1
          done
          echo "--- pubsub emulator log ---"; cat /tmp/pubsub-emulator.log
          echo "--- firestore emulator log ---"; cat /tmp/firestore-emulator.log

      - name: Run distributed negotiation test
        working-directory: backend
        run: pytest tests/integration/test_distributed_negotiation.py -v
        env:
          PUBSUB_EMULATOR_HOST: localhost:8085
          FIRESTORE_EMULATOR_HOST: localhost:8080
        # This job is separate from "Backend (pytest)" above and does not
        # touch it -- proves the real, opt-in Pub/Sub-decoupled
        # negotiation path (pact/worker/negotiation_worker.py + the
        # standalone Compliance Agent service) genuinely works, using the
        # official local emulators for both Pub/Sub and Firestore rather
        # than mocks. See docs/ARCHITECTURE.md.

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
