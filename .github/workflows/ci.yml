name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v
        # No GEMINI_API_KEY secret is configured here on purpose -- the two
        # tests in tests/integration/test_requirement_parser.py that need a
        # real key skip themselves (pytest.mark.skipif) rather than fail;
        # everything else, including the real AWS/Azure pricing API calls,
        # runs for real against the public internet.

  backend-distributed:
    name: Backend (distributed negotiation, Pub/Sub + Firestore emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Start Pub/Sub + Firestore emulators
        run: |
          gcloud components install pubsub-emulator beta cloud-firestore-emulator --quiet
          gcloud beta emulators pubsub start --host-port=localhost:8085 &
          gcloud emulators firestore start --host-port=localhost:8080 &
          sleep 8

      - name: Run distributed negotiation test
        working-directory: backend
        run: pytest tests/integration/test_distributed_negotiation.py -v
        env:
          PUBSUB_EMULATOR_HOST: localhost:8085
          FIRESTORE_EMULATOR_HOST: localhost:8080
        # This job is separate from "Backend (pytest)" above and does not
        # touch it -- proves the real, opt-in Pub/Sub-decoupled
        # negotiation path (pact/worker/negotiation_worker.py + the
        # standalone Compliance Agent service) genuinely works, using the
        # official local emulators for both Pub/Sub and Firestore rather
        # than mocks. See docs/ARCHITECTURE.md.

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
